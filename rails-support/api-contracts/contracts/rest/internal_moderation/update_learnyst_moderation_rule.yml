# ──────────────────────────────────────────────────────────────────────────────
# Update Learnyst Moderation Rule (Learnyst Monitor → Rails)
# AI UGC Moderation — Rails hand-over contract.
# Format: learnyst-admin api-contracts (docs/template.md); passes validator/validate.js.
# Explained in: rails-support/README.md · Open questions: open-items.md
# ──────────────────────────────────────────────────────────────────────────────
operation:
  display_name: Update Learnyst Moderation Rule (Learnyst Monitor → Rails)
  description: |-
    Priority P1 · SR 1 · HLD §13 · NEW Rails endpoint, internal host, /internal/v1 namespace.
    Replaces a Learnyst standard rule's fields from the Learnyst Monitor — every field is sent, as on create. Only a
    moderation_rules row with source = learnyst; an academy rule's id answers RULE_NOT_FOUND (decision 2026-10-06).
    This is also how the Monitor publishes (status draft → published) and unpublishes (published → draft:
    it stops being checked; its blocked words are kept). Rewording or publishing applies only to content
    posted from then on (spec — Rules, Lifecycle). The change applies to every academy at once:
    One row per Learnyst rule, shared by every academy; academies can never change it (decision 2026-10-06).
    Rails records the token's email as updated_by and in the record (SR 11). Auth: the Monitor's JWT — see
    list_learnyst_moderation_rules.
  tags:
    - moderation
    - service-to-service
    - monitor-calls-rails
    - rules
    - p1
  side_effects:
    - updates_learnyst_rule
    - writes_moderation_log
  idempotent: true
rest:
  method: PUT
  path: /internal/v1/moderation/learnyst_rules/{id}
  path_params:
    - name: id
      type: id
      description: The Learnyst rule, from list_learnyst_moderation_rules.
      example: '6'
  auth: bearer_token
input:
  fields:
    - name: id
      type: id
      required: true
      nullable: false
      description: The Learnyst rule (the {id} path parameter).
      example: '6'
      depends_on:
        operation: contracts/rest/internal_moderation/list_learnyst_moderation_rules
        field_returned: id
        pass_as: id
    - name: name
      type: string
      required: true
      nullable: false
      description: Rule name.
      example: No spam or advertising
      min_length: 1
      max_length: 200
    - name: description
      type: string
      required: true
      nullable: false
      description: What it means, in plain English. The AI checks content against exactly this.
      example: No promotions, advertising or selling of any kind.
      min_length: 1
      max_length: 2000
    - name: action
      type: enum
      required: true
      nullable: false
      description: What happens when it is broken.
      example: block
      enum_values:
        - value: guidance
          description: Goes live. The learner gets a gentle note.
        - value: report
          description: Goes live and into the queue. The learner is told nothing.
        - value: hold
          description: Held for review. The learner is told which rule it is being checked against.
        - value: block
          description: Not posted, not queued. The learner is told the rule, and why.
    - name: ai_check_enabled
      type: boolean
      required: true
      nullable: false
      description: Checked by AI. Off → only the blocked words are checked. Off with no blocked words → the rule is only a report reason.
      example: true
    - name: pinned_to_copilot
      type: boolean
      required: true
      nullable: false
      description: Content that breaks it always goes to the queue, even on Autopilot.
      example: false
    - name: is_self_harm
      type: boolean
      required: true
      nullable: false
      description: The self-harm rule. Learners are never told its name. The Monitor turns pinned_to_copilot on when this is switched on.
      example: false
    - name: report_reason
      type: string
      required: false
      nullable: true
      description: The wording learners see when they report content or their content is stopped.
      example: Spam or advertising
      default: null
      max_length: 200
    - name: blocked_words
      type: array
      required: true
      nullable: false
      description: Words and web addresses for this rule. Rails decides which each one is and matches them itself (HLD §4); a match stops content on sight, with no AI check.
      example:
        - buy now
      min_items: 0
      items:
        type: string
        max_length: 255
    - name: status
      type: enum
      required: true
      nullable: false
      description: Keep or change the status. draft on a published rule unpublishes it.
      example: draft
      enum_values:
        - value: draft
          description: Saved, not applied.
        - value: published
          description: Applied to every academy, for content posted from now on.
response:
  success:
    http_status: 200
    description: The rule as saved — the same shape as one entry of list_learnyst_moderation_rules.
    fields:
      - name: message
        type: string
        nullable: false
        description: Confirmation for logs.
        example: Rule saved.
        max_length: 200
      - name: rule
        type: object
        nullable: false
        description: The saved rule (see list_learnyst_moderation_rules for every field).
        example: {}
        fields:
          - name: id
            type: id
            nullable: false
            description: The rule.
            example: '6'
          - name: number
            type: integer
            nullable: false
            description: Unchanged by an update.
            example: 6
            min_value: 1
          - name: status
            type: enum
            nullable: false
            description: As sent.
            example: draft
            enum_values:
              - value: draft
                description: Saved, not applied.
              - value: published
                description: Applied to every academy.
  errors:
    validation_errors:
      - code: INVALID_INPUT
        http_status: 422
        message: Rule failed validation.
        description: A required field is missing or a limit is exceeded. The Monitor validates the same limits first and shows the message.
    auth_errors:
      - code: UNAUTHORIZED
        http_status: 401
        message: Invalid monitor token.
        description: See list_learnyst_moderation_rules.
    system_errors:
      - code: INTERNAL_SERVER_ERROR
        http_status: 500
        message: Rails error.
        description: Nothing is saved; the Monitor shows the error.
    business_errors:
      - code: RULE_NOT_FOUND
        http_status: 404
        message: This rule no longer exists.
        description: Deleted by someone else since the Monitor loaded it, or the id is an academy rule (source = academy), which the Monitor may never change.
ai_hints:
  test_scenarios:
    - name: unpublish_keeps_words
      description: status published → draft stops the rule being checked and keeps its blocked words.
    - name: applies_everywhere
      description: After an edit, every academy's next check sends the new wording to ai-server — no academy keeps an old version.
    - name: editor_recorded
      description: updated_by equals the token's email, and the change is in the record.
