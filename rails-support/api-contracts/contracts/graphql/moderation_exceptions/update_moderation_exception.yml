# ──────────────────────────────────────────────────────────────────────────────
# Update Moderation Exception
# AI UGC Moderation — Rails hand-over contract.
# Format: learnyst-admin api-contracts (docs/template.md); passes validator/validate.js.
# Explained in: rails-support/README.md · Open questions: open-items.md
# ──────────────────────────────────────────────────────────────────────────────
operation:
  display_name: Update Moderation Exception
  description: |-
    NEW mutation · Priority P2 · stories 11, 12 · Teacher only.
    Change an exception's modes, or switch rules off / back on for the product (disabled_rule_ids is the full
    new list — dropping a rule from it switches it back on so it follows the academy again, story 12).
  tags:
    - moderation
    - admin
    - exceptions
    - p2
  side_effects:
    - updates_exception
    - writes_moderation_log
  idempotent: true
graphql:
  operation_type: mutation
  operation_name: UpdateModerationException
  input_type: UpdateModerationExceptionInput
  return_type: UpdateModerationExceptionPayload
  example_document: |-
    mutation UpdateModerationException($input: UpdateModerationExceptionInput!) {
      updateModerationException(input: $input) {
        message
        exception {
          id
          product { id type name }
          contentReviewMode
          moderationMode
          disabledRules { id number name }
          setOn
        }
      }
    }
input:
  fields:
    - name: exception_id
      type: id
      required: true
      nullable: false
      description: The exception.
      example: '7'
      depends_on:
        operation: contracts/graphql/moderation_exceptions/list_moderation_exceptions
        field_returned: id
        pass_as: exception_id
    - name: content_review_mode
      type: enum
      required: false
      nullable: true
      description: Null = follow the academy.
      example: null
      default: null
      enum_values:
        - value: REVIEW_FIRST
          description: Content is held until the verdict arrives. Default.
        - value: PUBLISH_FIRST
          description: Content goes live at once and comes down if it breaks a rule.
    - name: moderation_mode
      type: enum
      required: false
      nullable: true
      description: Null = follow the academy.
      example: null
      default: null
      enum_values:
        - value: AUTOPILOT
          description: The rule's action is applied automatically.
        - value: COPILOT
          description: Nothing is stopped automatically; flagged content waits for a person.
        - value: AI_DISABLED
          description: The AI never runs. Blocked words and learner reports only.
    - name: disabled_rule_ids
      type: array
      required: false
      nullable: true
      description: Full list of rules switched off here. Omit to leave unchanged.
      example: null
      default: null
      min_items: 0
      items:
        type: id
response:
  success:
    http_status: 200
    description: The updated exception.
    fields:
      - name: message
        type: string
        nullable: false
        description: 'Confirmation text, as other Learnyst admin mutations return.'
        example: Done.
      - name: exception
        type: object
        nullable: false
        description: The exception.
        example: {}
        fields:
          - name: id
            type: id
            nullable: false
            description: Exception id.
            example: '7'
            read_only: true
          - name: product
            type: object
            nullable: false
            description: '"Product" — the one product set differently.'
            example:
              id: '314'
              type: COURSE
              name: NEET Biology 2027
            fields:
              - name: id
                type: id
                nullable: false
                description: Product id.
                example: '314'
                read_only: true
              - name: type
                type: enum
                nullable: false
                description: Product type.
                example: COURSE
                enum_values:
                  - value: COURSE
                    description: Course.
                  - value: BATCH
                    description: Batch.
                  - value: BUNDLE
                    description: Bundle.
                  - value: MOCK_TEST
                    description: Mock test.
                  - value: TEST_SERIES
                    description: Test series.
                  - value: EBOOK
                    description: Ebook.
                  - value: WEBINAR
                    description: Webinar.
                  - value: FREE_RESOURCE
                    description: Free resource.
                  - value: PODCAST
                    description: Podcast.
                  - value: CUSTOM
                    description: Custom product.
              - name: name
                type: string
                nullable: false
                description: Product name.
                example: NEET Biology 2027
          - name: content_review_mode
            type: enum
            nullable: true
            description: Overrides the academy's content review mode for this product. Null = follows the academy.
            example: REVIEW_FIRST
            enum_values:
              - value: REVIEW_FIRST
                description: Content is held until the verdict arrives. Default.
              - value: PUBLISH_FIRST
                description: Content goes live at once and comes down if it breaks a rule.
          - name: moderation_mode
            type: enum
            nullable: true
            description: Overrides the academy's moderation mode for this product. Null = follows the academy.
            example: null
            enum_values:
              - value: AUTOPILOT
                description: The rule's action is applied automatically.
              - value: COPILOT
                description: Nothing is stopped automatically; flagged content waits for a person.
              - value: AI_DISABLED
                description: The AI never runs. Blocked words and learner reports only.
          - name: disabled_rules
            type: array
            nullable: false
            description: 'Rules switched off for this product (stories 11–12). An exception can switch a rule off, never create one (system rule 6).'
            example: []
            items:
              type: object
              fields:
                - name: id
                  type: id
                  nullable: false
                  description: Rule id.
                  example: '42'
                  read_only: true
                - name: number
                  type: integer
                  nullable: false
                  description: Rule number.
                  example: 9
                - name: name
                  type: string
                  nullable: false
                  description: Rule name.
                  example: No promoting other academies
          - name: set_on
            type: datetime
            nullable: false
            description: '"Set on" — so a setting made months ago is not forgotten (story 14). "What is different" is composed from the three fields above.'
            example: '2026-05-02T10:00:00Z'
  errors:
    business_errors:
      - code: EXCEPTION_NOT_FOUND
        http_status: 200
        graphql_extension_code: EXCEPTION_NOT_FOUND
        field: exception_id
        message: This exception no longer exists.
        description: No exception with this id in the caller's academy — academy scoping is Rails' job (HLD §16).
    auth_errors:
      - code: UNAUTHORIZED
        http_status: 200
        graphql_extension_code: UNAUTHORIZED
        message: Please sign in again.
        description: No valid admin session token.
      - code: FORBIDDEN
        http_status: 200
        graphql_extension_code: FORBIDDEN
        message: Only a Teacher can do this.
        description: 'Caller is not a Teacher / Admin of this academy. Teaching Assistants cannot change settings or rules, or ban (stories list these as Teacher-only; spec: "Who can ban? Teachers only").'
    system_errors:
      - code: INTERNAL_SERVER_ERROR
        http_status: 200
        graphql_extension_code: INTERNAL_SERVER_ERROR
        message: Something went wrong. Please try again.
        description: Unhandled Rails exception.
