# ──────────────────────────────────────────────────────────────────────────────
# List Effective Moderation Rules (for a product)
# AI UGC Moderation — Rails hand-over contract.
# Format: learnyst-admin api-contracts (docs/template.md); passes validator/validate.js.
# Explained in: rails-support/README.md · Open questions: open-items.md
# ──────────────────────────────────────────────────────────────────────────────
operation:
  display_name: List Effective Moderation Rules (for a product)
  description: |-
    NEW query · Priority P2 · story 13 ("which rules are in force for a product").
    Every published rule with whether it is in force for this product after its exception — so the Teacher can
    see what an exception changed. Same resolution Rails uses to build rules[] for the check (HLD §13).
  tags:
    - moderation
    - admin
    - exceptions
    - rules
    - p2
  side_effects: []
  idempotent: true
graphql:
  operation_type: query
  operation_name: ListEffectiveModerationRules
  return_type: EffectiveModerationRuleConnection
  example_document: |-
    query ListEffectiveModerationRules($productId: ID!, $productType: ModerationProductTypeEnum!, $first: Int, $after: String) {
      listEffectiveModerationRules(productId: $productId, productType: $productType, first: $first, after: $after) {
        nodes { rule { id number name } inForce switchedOffByException }
        pageInfo { endCursor hasNextPage }
        totalCount
      }
    }
input:
  fields:
    - name: product_id
      type: id
      required: true
      nullable: false
      description: The product.
      example: '314'
      depends_on:
        operation: contracts/graphql/moderation_reports/list_moderation_product_activity
        field_returned: product
        pass_as: product_id
        ui_hint: product.id — or any existing product picker.
    - name: product_type
      type: enum
      required: true
      nullable: false
      description: Its type.
      example: COURSE
      enum_values:
        - value: COURSE
          description: Course.
        - value: BATCH
          description: Batch.
        - value: BUNDLE
          description: Bundle.
        - value: MOCK_TEST
          description: Mock test.
        - value: TEST_SERIES
          description: Test series.
        - value: EBOOK
          description: Ebook.
        - value: WEBINAR
          description: Webinar.
        - value: FREE_RESOURCE
          description: Free resource.
        - value: PODCAST
          description: Podcast.
        - value: CUSTOM
          description: Custom product.
    - name: first
      type: integer
      required: false
      nullable: false
      description: 'Page size, as on existing Learnyst list queries.'
      example: 20
      default: 20
      min_value: 1
      max_value: 100
    - name: after
      type: string
      required: false
      nullable: true
      description: Cursor from page_info.end_cursor of the previous page.
      example: null
      default: null
      min_length: 1
response:
  success:
    http_status: 200
    description: Rules and whether each is in force here.
    fields:
      - name: nodes
        type: array
        nullable: false
        description: One row per published rule.
        example: []
        items:
          type: object
          fields:
            - name: rule
              type: object
              nullable: false
              description: The rule involved.
              example:
                id: '42'
                number: 6
                name: No spam or advertising
              fields:
                - name: id
                  type: id
                  nullable: false
                  description: Rule id.
                  example: '42'
                  read_only: true
                - name: number
                  type: integer
                  nullable: false
                  description: Rule number in creation order.
                  example: 6
                - name: name
                  type: string
                  nullable: false
                  description: The academy's rule name.
                  example: No spam or advertising
            - name: in_force
              type: boolean
              nullable: false
              description: Enforced for this product.
              example: true
            - name: switched_off_by_exception
              type: boolean
              nullable: false
              description: True when this product's exception switched it off.
              example: false
      - name: page_info
        type: object
        nullable: false
        description: 'Cursor pagination, same shape as listCommunityPosts today (system rule 17: every listing is paginated).'
        example:
          end_cursor: MjA
          has_next_page: true
        fields:
          - name: end_cursor
            type: string
            nullable: true
            description: Pass as `after` to fetch the next page.
            example: MjA
          - name: has_next_page
            type: boolean
            nullable: false
            description: Whether another page exists.
            example: true
      - name: total_count
        type: integer
        nullable: false
        description: Total rows matching the filters.
        example: 57
  errors:
    auth_errors:
      - code: UNAUTHORIZED
        http_status: 200
        graphql_extension_code: UNAUTHORIZED
        message: Please sign in again.
        description: No valid admin session token.
      - code: FORBIDDEN
        http_status: 200
        graphql_extension_code: FORBIDDEN
        message: Only a Teacher can do this.
        description: 'Caller is not a Teacher / Admin of this academy. Teaching Assistants cannot change settings or rules, or ban (stories list these as Teacher-only; spec: "Who can ban? Teachers only").'
    system_errors:
      - code: INTERNAL_SERVER_ERROR
        http_status: 200
        graphql_extension_code: INTERNAL_SERVER_ERROR
        message: Something went wrong. Please try again.
        description: Unhandled Rails exception.
