# ──────────────────────────────────────────────────────────────────────────────
# Delete Moderation Exception
# AI UGC Moderation — Rails hand-over contract.
# Format: learnyst-admin api-contracts (docs/template.md); passes validator/validate.js.
# Explained in: rails-support/README.md · Open questions: open-items.md
# ──────────────────────────────────────────────────────────────────────────────
operation:
  display_name: Delete Moderation Exception
  description: |-
    NEW mutation · Priority P2 · story 15 · Teacher only.
    Removes the exception so the product follows the academy settings again.
  tags:
    - moderation
    - admin
    - exceptions
    - p2
  side_effects:
    - deletes_exception
    - writes_moderation_log
  idempotent: true
graphql:
  operation_type: mutation
  operation_name: DeleteModerationException
  input_type: DeleteModerationExceptionInput
  return_type: DeleteModerationExceptionPayload
  example_document: |-
    mutation DeleteModerationException($input: DeleteModerationExceptionInput!) {
      deleteModerationException(input: $input) {
        message
      }
    }
input:
  fields:
    - name: exception_id
      type: id
      required: true
      nullable: false
      description: The exception.
      example: '7'
      depends_on:
        operation: contracts/graphql/moderation_exceptions/list_moderation_exceptions
        field_returned: id
        pass_as: exception_id
response:
  success:
    http_status: 200
    description: Removed.
    fields:
      - name: message
        type: string
        nullable: false
        description: 'Confirmation text, as other Learnyst admin mutations return.'
        example: Done.
  errors:
    business_errors:
      - code: EXCEPTION_NOT_FOUND
        http_status: 200
        graphql_extension_code: EXCEPTION_NOT_FOUND
        field: exception_id
        message: This exception no longer exists.
        description: No exception with this id in the caller's academy — academy scoping is Rails' job (HLD §16).
    auth_errors:
      - code: UNAUTHORIZED
        http_status: 200
        graphql_extension_code: UNAUTHORIZED
        message: Please sign in again.
        description: No valid admin session token.
      - code: FORBIDDEN
        http_status: 200
        graphql_extension_code: FORBIDDEN
        message: Only a Teacher can do this.
        description: 'Caller is not a Teacher / Admin of this academy. Teaching Assistants cannot change settings or rules, or ban (stories list these as Teacher-only; spec: "Who can ban? Teachers only").'
    system_errors:
      - code: INTERNAL_SERVER_ERROR
        http_status: 200
        graphql_extension_code: INTERNAL_SERVER_ERROR
        message: Something went wrong. Please try again.
        description: Unhandled Rails exception.
