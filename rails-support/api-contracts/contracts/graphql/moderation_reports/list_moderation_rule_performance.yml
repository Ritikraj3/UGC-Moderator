# ──────────────────────────────────────────────────────────────────────────────
# List Moderation Rule Performance
# AI UGC Moderation — Rails hand-over contract.
# Format: learnyst-admin api-contracts (docs/template.md); passes validator/validate.js.
# Explained in: rails-support/README.md · Open questions: open-items.md
# ──────────────────────────────────────────────────────────────────────────────
operation:
  display_name: List Moderation Rule Performance
  description: |-
    NEW query · Priority P1 · stories 62, 63 · spec "Rule performance".
    Per rule, over 7 or 30 days: "Rule, Times this rule stopped content, Approved anyway by a Teacher, Removed,
    Wrong-flag rate". Approved high → too strict; removed high → missing things; never fires → too vague (spec) —
    so rules that never fired are included. Every number opens its content (story 63) via
    listModerationQueueItems(ruleId, decision, dateFrom, dateTo).
  tags:
    - moderation
    - admin
    - reports
    - p1
  side_effects: []
  idempotent: true
graphql:
  operation_type: query
  operation_name: ListModerationRulePerformance
  return_type: ModerationRulePerformanceConnection
  example_document: |-
    query ListModerationRulePerformance($period: ModerationReportPeriodEnum!, $first: Int, $after: String) {
      listModerationRulePerformance(period: $period, first: $first, after: $after) {
        nodes { rule { id number name } timesStopped approvedAnyway removed wrongFlagRate }
        pageInfo { endCursor hasNextPage }
        totalCount
      }
    }
input:
  fields:
    - name: period
      type: enum
      required: true
      nullable: false
      description: 'Report period. The spec gives 7 or 30 days for rule performance; the other reports'' periods are not stated, so the same two are PROPOSED.'
      example: LAST_30_DAYS
      enum_values:
        - value: LAST_7_DAYS
          description: The last 7 days.
        - value: LAST_30_DAYS
          description: The last 30 days.
    - name: first
      type: integer
      required: false
      nullable: false
      description: 'Page size, as on existing Learnyst list queries.'
      example: 20
      default: 20
      min_value: 1
      max_value: 100
    - name: after
      type: string
      required: false
      nullable: true
      description: Cursor from page_info.end_cursor of the previous page.
      example: null
      default: null
      min_length: 1
response:
  success:
    http_status: 200
    description: One row per published rule.
    fields:
      - name: nodes
        type: array
        nullable: false
        description: Rows.
        example: []
        items:
          type: object
          fields:
            - name: rule
              type: object
              nullable: false
              description: The rule involved.
              example:
                id: '42'
                number: 6
                name: No spam or advertising
              fields:
                - name: id
                  type: id
                  nullable: false
                  description: Rule id.
                  example: '42'
                  read_only: true
                - name: number
                  type: integer
                  nullable: false
                  description: Rule number in creation order.
                  example: 6
                - name: name
                  type: string
                  nullable: false
                  description: The academy's rule name.
                  example: No spam or advertising
            - name: times_stopped
              type: integer
              nullable: false
              description: '"Times this rule stopped content".'
              example: 74
            - name: approved_anyway
              type: integer
              nullable: false
              description: '"Approved anyway by a Teacher".'
              example: 32
            - name: removed
              type: integer
              nullable: false
              description: '"Removed".'
              example: 40
            - name: wrong_flag_rate
              type: float
              nullable: true
              description: 'Content a rule stopped that a Teacher then approved, as a percentage. Null when nothing was stopped.'
              example: 43
              computed: true
              computed_description: approved_after_stop / times_stopped × 100
      - name: page_info
        type: object
        nullable: false
        description: 'Cursor pagination, same shape as listCommunityPosts today (system rule 17: every listing is paginated).'
        example:
          end_cursor: MjA
          has_next_page: true
        fields:
          - name: end_cursor
            type: string
            nullable: true
            description: Pass as `after` to fetch the next page.
            example: MjA
          - name: has_next_page
            type: boolean
            nullable: false
            description: Whether another page exists.
            example: true
      - name: total_count
        type: integer
        nullable: false
        description: Total rows matching the filters.
        example: 57
  errors:
    auth_errors:
      - code: UNAUTHORIZED
        http_status: 200
        graphql_extension_code: UNAUTHORIZED
        message: Please sign in again.
        description: No valid admin session token.
      - code: FORBIDDEN
        http_status: 200
        graphql_extension_code: FORBIDDEN
        message: Only a Teacher can do this.
        description: 'Caller is not a Teacher / Admin of this academy. Teaching Assistants cannot change settings or rules, or ban (stories list these as Teacher-only; spec: "Who can ban? Teachers only").'
    system_errors:
      - code: INTERNAL_SERVER_ERROR
        http_status: 200
        graphql_extension_code: INTERNAL_SERVER_ERROR
        message: Something went wrong. Please try again.
        description: Unhandled Rails exception.
