# ──────────────────────────────────────────────────────────────────────────────
# List Moderation Queue Items
# AI UGC Moderation — Rails hand-over contract.
# Format: learnyst-admin api-contracts (docs/template.md); passes validator/validate.js.
# Explained in: rails-support/README.md · Open questions: open-items.md
# ──────────────────────────────────────────────────────────────────────────────
operation:
  display_name: List Moderation Queue Items
  description: |-
    NEW query · Priority P1 · stories 36, 45, 51, 63 · spec "The review queue" · HLD §8.
    The landing screen of Moderation. Four tabs — Needs review · Reported · Unchecked · Done — with filters by
    content area, product, rule and date (spec). "Content, Rule broken, Why it was stopped, Learner, Product,
    Where it is, Status, Waiting time" (story 36). Teachers and Teaching Assistants both see the whole queue and
    filter by product (system rule 18). Also serves the Rule performance drill-down (story 63: rule + decision +
    dates). Held items edited after being held sort to the back (spec). Paginated (system rule 17).
  tags:
    - moderation
    - admin
    - queue
    - p1
  side_effects: []
  idempotent: true
graphql:
  operation_type: query
  operation_name: ListModerationQueueItems
  return_type: ModerationQueueItemConnection
  example_document: |-
    query ListModerationQueueItems($tab: ModerationQueueTabEnum!, $contentArea: ModerationContentAreaEnum, $productId: ID, $ruleId: ID, $decision: ModerationDecisionEnum, $dateFrom: String, $dateTo: String, $first: Int, $after: String) {
      listModerationQueueItems(tab: $tab, contentArea: $contentArea, productId: $productId, ruleId: $ruleId, decision: $decision, dateFrom: $dateFrom, dateTo: $dateTo, first: $first, after: $after) {
        nodes {
          id
          content { type id title body imageUrl }
          contentVersion
          ruleBroken { id number name }
          whyStopped { source reason matchedWord confidence }
          learner { id name profilePhotoFileName }
          product { id type name }
          contentArea
          status
          contentModerationStatus
          reportCount
          editedAfterHeld
          waitingSince
          decidedAt
          isExample
        }
        pageInfo { endCursor hasNextPage }
        totalCount
      }
    }
input:
  fields:
    - name: tab
      type: enum
      required: true
      nullable: false
      description: Which tab.
      example: NEEDS_REVIEW
      enum_values:
        - value: NEEDS_REVIEW
          description: Held or flagged content waiting for a person.
        - value: REPORTED
          description: Content learners reported.
        - value: UNCHECKED
          description: Content published without a check — the deadline fired or ai-server errored.
        - value: DONE
          description: 'Decided items (approved, removed, restored).'
    - name: content_area
      type: enum
      required: false
      nullable: true
      description: Filter by content area.
      example: null
      default: null
      enum_values:
        - value: PRODUCT_DISCUSSIONS
          description: 'The discussion under any course, bundle, batch, mock test, test series, ebook, webinar, free resource, podcast or custom product (spec — Scope).'
        - value: COMMUNITY
          description: Community posts and their comments (spec — Scope).
        - value: FEEDS
          description: Feed posts and their comments (spec — Scope).
        - value: NEWSFEED
          description: Newsfeed discussions (spec — Scope).
    - name: product_id
      type: id
      required: false
      nullable: true
      description: Filter by product.
      example: null
      default: null
      depends_on:
        operation: contracts/graphql/moderation_reports/list_moderation_product_activity
        field_returned: product
        pass_as: product_id
        ui_hint: product.id — or any existing product picker.
    - name: rule_id
      type: id
      required: false
      nullable: true
      description: Filter by rule.
      example: null
      default: null
      depends_on:
        operation: contracts/graphql/moderation_rules/list_moderation_rules
        field_returned: id
        pass_as: rule_id
    - name: decision
      type: enum
      required: false
      nullable: true
      description: 'For DONE: only approved or only removed items (story 63 drill-down).'
      example: null
      default: null
      enum_values:
        - value: APPROVED
          description: Items a person approved.
        - value: REMOVED
          description: Items a person removed.
    - name: date_from
      type: datetime
      required: false
      nullable: true
      description: Filter from this time (content created).
      example: null
      default: null
    - name: date_to
      type: datetime
      required: false
      nullable: true
      description: Filter up to this time.
      example: null
      default: null
    - name: first
      type: integer
      required: false
      nullable: false
      description: 'Page size, as on existing Learnyst list queries.'
      example: 20
      default: 20
      min_value: 1
      max_value: 100
    - name: after
      type: string
      required: false
      nullable: true
      description: Cursor from page_info.end_cursor of the previous page.
      example: null
      default: null
      min_length: 1
response:
  success:
    http_status: 200
    description: Queue items. Needs review sorts oldest first.
    fields:
      - name: nodes
        type: array
        nullable: false
        description: Items.
        example: []
        items:
          type: object
          fields:
            - name: id
              type: id
              nullable: false
              description: Queue item id.
              example: '3001'
              read_only: true
            - name: content
              type: object
              nullable: true
              description: '"Content" (story 36).'
              example:
                type: COMMUNITY_POST
                id: '5521'
                title: Join XYZ Academy
                body: 'Lower fees, DM me'
                image_url: null
              fields:
                - name: type
                  type: enum
                  nullable: false
                  description: Which Rails model the content lives in.
                  example: COMMUNITY_POST
                  enum_values:
                    - value: COMMUNITY_POST
                      description: A community post — Rails Post + CommunityContent (createCommunityPost / updateCommunityPost).
                    - value: NEWSFEED_POST
                      description: A feed post — Rails NewsfeedPost (createNewsfeedPost / updateNewsfeedPost).
                    - value: DISCUSSION
                      description: A DiscussionBoard row — a comment on a community/feed post (postId) or a thread in a product discussion (packageId/courseId).
                    - value: DISCUSSION_REPLY
                      description: A Comment row — a reply under a DiscussionBoard (createComment / updateComment).
                - name: id
                  type: id
                  nullable: false
                  description: Id in that model.
                  example: '5521'
                  read_only: true
                - name: title
                  type: string
                  nullable: true
                  description: 'Title, when the content has one.'
                  example: Join XYZ Academy
                - name: body
                  type: string
                  nullable: true
                  description: The text as the learner wrote it (the version under review).
                  example: 'Lower fees, DM me'
                - name: image_url
                  type: string
                  nullable: true
                  description: 'The uploaded image, if any (posts.featured_image, comments.attachment_url, comments.image).'
                  example: null
            - name: content_version
              type: integer
              nullable: false
              description: The version under review.
              example: 2
            - name: rule_broken
              type: object
              nullable: true
              description: '"Rule broken" (story 36). Null for UNCHECKED items and repeat/restricted holds.'
              example:
                id: '42'
                number: 6
                name: No spam or advertising
              fields:
                - name: id
                  type: id
                  nullable: false
                  description: Rule id.
                  example: '42'
                  read_only: true
                - name: number
                  type: integer
                  nullable: false
                  description: Rule number in creation order.
                  example: 6
                - name: name
                  type: string
                  nullable: false
                  description: The academy's rule name.
                  example: No spam or advertising
            - name: why_stopped
              type: object
              nullable: false
              description: '"Why it was stopped" (story 36).'
              example:
                source: AI_CHECK
                reason: 'Links to an outside site offering a discount, which reads as advertising'
                matched_word: null
                confidence: HIGH
              fields:
                - name: source
                  type: enum
                  nullable: false
                  description: What stopped it.
                  example: AI_CHECK
                  enum_values:
                    - value: AI_CHECK
                      description: The AI check named a rule. reason holds the AI's sentence (admin-only).
                    - value: BLOCKED_WORD
                      description: 'A blocked word or web address on the rule matched (local, no AI call).'
                    - value: LEARNER_REPORT
                      description: One or more learners reported it.
                    - value: REPEAT_POST
                      description: 'Repeated content inside the academy''s spam window (local, no AI call).'
                    - value: RESTRICTED_MEMBER
                      description: 'The author is restricted, so everything they post is held (local, no AI call).'
                    - value: FIRST_POSTS_HOLD
                      description: 'One of a new learner''s first posts, held by the academy setting.'
                    - value: UNCHECKED
                      description: 'No verdict arrived before the deadline, or ai-server returned status error.'
                - name: reason
                  type: string
                  nullable: true
                  description: 'The AI''s generated reason — shown in the queue row, never to a learner (HLD §12).'
                  example: 'Links to an outside site offering a discount, which reads as advertising'
                - name: matched_word
                  type: string
                  nullable: true
                  description: 'The blocked word that matched, for BLOCKED_WORD.'
                  example: null
                - name: confidence
                  type: enum
                  nullable: true
                  description: 'The AI''s confidence, for AI_CHECK.'
                  example: HIGH
                  enum_values:
                    - value: LOW
                      description: Low.
                    - value: MEDIUM
                      description: Medium.
                    - value: HIGH
                      description: High.
            - name: learner
              type: object
              nullable: false
              description: The learner who wrote the content.
              example:
                id: '9001'
                name: Asha K
                profile_photo_file_name: null
              fields:
                - name: id
                  type: id
                  nullable: false
                  description: User id.
                  example: '9001'
                  read_only: true
                - name: name
                  type: string
                  nullable: false
                  description: Display name.
                  example: Asha K
                - name: profile_photo_file_name
                  type: string
                  nullable: true
                  description: 'Existing avatar field, as on posts today.'
                  example: null
            - name: product
              type: object
              nullable: true
              description: 'The product the content sits in. Null for Community, Feeds and Newsfeed content.'
              example:
                id: '314'
                type: COURSE
                name: NEET Biology 2027
              fields:
                - name: id
                  type: id
                  nullable: false
                  description: Product id.
                  example: '314'
                  read_only: true
                - name: type
                  type: enum
                  nullable: false
                  description: Product type.
                  example: COURSE
                  enum_values:
                    - value: COURSE
                      description: Course.
                    - value: BATCH
                      description: Batch.
                    - value: BUNDLE
                      description: Bundle.
                    - value: MOCK_TEST
                      description: Mock test.
                    - value: TEST_SERIES
                      description: Test series.
                    - value: EBOOK
                      description: Ebook.
                    - value: WEBINAR
                      description: Webinar.
                    - value: FREE_RESOURCE
                      description: Free resource.
                    - value: PODCAST
                      description: Podcast.
                    - value: CUSTOM
                      description: Custom product.
                - name: name
                  type: string
                  nullable: false
                  description: Product name.
                  example: NEET Biology 2027
            - name: content_area
              type: enum
              nullable: false
              description: '"Where it is" (story 36).'
              example: COMMUNITY
              enum_values:
                - value: PRODUCT_DISCUSSIONS
                  description: 'The discussion under any course, bundle, batch, mock test, test series, ebook, webinar, free resource, podcast or custom product (spec — Scope).'
                - value: COMMUNITY
                  description: Community posts and their comments (spec — Scope).
                - value: FEEDS
                  description: Feed posts and their comments (spec — Scope).
                - value: NEWSFEED
                  description: Newsfeed discussions (spec — Scope).
            - name: status
              type: enum
              nullable: false
              description: '"Status" (story 36).'
              example: PENDING
              enum_values:
                - value: PENDING
                  description: Waiting for a person.
                - value: APPROVED
                  description: A person let it through — it is live.
                - value: REMOVED
                  description: A person took it down — restorable for 90 days.
            - name: content_moderation_status
              type: enum
              nullable: false
              description: 'What learners currently see — held, live or removed.'
              example: HELD
              enum_values:
                - value: PUBLISHED
                  description: 'Visible to everyone who can see this place. Covers content that passed the check, was published without a check (Unchecked), got Guidance or a Report-action flag, or was approved.'
                - value: HELD
                  description: 'Exists but visible only to its author, marked Waiting for review — review-first content waiting for its verdict, a Hold rule, a restricted learner, a repeated post or a new learner''s first posts.'
                - value: REMOVED
                  description: 'Taken down from the queue by a Teacher or Teaching Assistant. Visible only to its author, with the rule. Restorable for 90 days.'
                - value: BLOCKED
                  description: 'Stopped by a Block rule after the content had been written (an AI verdict). Visible only to its author, with the rule. Never restorable. See open question C20.'
            - name: report_count
              type: integer
              nullable: false
              description: Learner reports on this content. Rails counts reports per post (HLD §7).
              example: 0
            - name: edited_after_held
              type: boolean
              nullable: false
              description: Flagged "edited after being held" — sent to the back of the queue (spec).
              example: false
            - name: waiting_since
              type: datetime
              nullable: false
              description: When it started waiting. "Waiting time" = now − waiting_since (story 36).
              example: '2026-09-30T09:30:00Z'
            - name: decided_at
              type: datetime
              nullable: true
              description: When a person decided.
              example: null
            - name: is_example
              type: boolean
              nullable: false
              description: Marked as an example (story 46).
              example: false
      - name: page_info
        type: object
        nullable: false
        description: 'Cursor pagination, same shape as listCommunityPosts today (system rule 17: every listing is paginated).'
        example:
          end_cursor: MjA
          has_next_page: true
        fields:
          - name: end_cursor
            type: string
            nullable: true
            description: Pass as `after` to fetch the next page.
            example: MjA
          - name: has_next_page
            type: boolean
            nullable: false
            description: Whether another page exists.
            example: true
      - name: total_count
        type: integer
        nullable: false
        description: Total rows matching the filters.
        example: 57
  errors:
    auth_errors:
      - code: UNAUTHORIZED
        http_status: 200
        graphql_extension_code: UNAUTHORIZED
        message: Please sign in again.
        description: No valid admin session token.
      - code: FORBIDDEN
        http_status: 200
        graphql_extension_code: FORBIDDEN
        message: You do not have access to moderation.
        description: Caller is neither a Teacher nor a Teaching Assistant of this academy. Moderation permissions are academy-wide (system rule 18).
    system_errors:
      - code: INTERNAL_SERVER_ERROR
        http_status: 200
        graphql_extension_code: INTERNAL_SERVER_ERROR
        message: Something went wrong. Please try again.
        description: Unhandled Rails exception.
