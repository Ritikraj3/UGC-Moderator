      <div class="radios" style="grid-template-columns:1fr">
        <button class="rcard" role="radio" aria-checked=${scope === 'PRODUCT'} onClick=${() => setScope('PRODUCT')}><b><span class="dot"></span>From one product</b><span>They lose posting where they caused trouble and keep the rest of the academy (row 48).</span></button>
        ${scope === 'PRODUCT' && html`<select class="inp" value=${prod} onChange=${e => setProd(e.target.value)} aria-label="Product">${E.PRODUCTS.map(x => html`<option value=${x.id}>${x.type} · ${x.name}</option>`)}</select>`}
        <button class="rcard" role="radio" aria-checked=${scope === 'ACADEMY'} onClick=${() => setScope('ACADEMY')}><b><span class="dot"></span>From the whole academy</b><span>They cannot post in any product. Replaces any product ban (row 49, SR 19).</span></button></div>
      <div class="f"><button class="btn outline" onClick=${onClose}>Cancel</button><button class="btn danger" onClick=${() => { E.ban(userId, scope, scope === 'PRODUCT' ? prod : null); onClose() }}>Ban</button></div></div></div>`;
  }

  // ── rules ──
  function Rules() {
    const [open, setOpen] = useState(null);
    const teacher = S.role === 'Teacher';
    const checkedBy = r => { const w = S.words.some(x => x.ruleId === r.id); return w && r.aiCheck ? 'Words + AI' : w ? 'Words' : r.aiCheck ? 'AI' : 'Not checked' };
    return html`<div class="a-page">
      <div class="a-head"><div><h2>Rules & blocked words</h2><p>Your academy's rules, in your own words. The AI judges against the description; blocked words stop content on sight with no AI check. <span class="story">rows 17–34</span></p></div>
        <button class="btn primary" disabled=${!teacher} title=${teacher ? '' : 'Teacher only'} onClick=${() => setOpen('new')}>+ New rule</button></div>
      <div class="card"><div class="tablewrap"><table class="t"><thead><tr><th>Rule</th><th>Checked by</th><th>What happens when it is broken</th><th>Status</th><th>Source</th></tr></thead>
        <tbody>${S.rules.map(r => html`<tr class="click" onClick=${() => setOpen(r.id)}>
          <td><div class="cell-content"><b>Rule ${r.number} · ${r.name}</b><span>${r.description}</span></div></td>
          <td>${checkedBy(r)}${r.pinned ? html` <span class="badge info">Pinned to Copilot</span>` : ''}</td>

          <td>${r.status === 'PUBLISHED' ? html`<span class="badge ok">Published</span>` : html`<span class="badge">Draft</span>`}</td>
          <td>${r.source === 'LEARNYST' ? 'Learnyst' : 'Academy'}</td></tr>`)}</tbody></table></div></div>
      <p class="story" style="margin:0">Sample rules for this prototype. A new academy starts with ten published Learnyst rules (SR 1); the stories and HLD do not list them.</p>
      ${open && html`<${RuleSheet} id=${open === 'new' ? null : open} onClose=${() => setOpen(null)} />`}
    </div>`;
  }

  function RuleSheet({ id, onClose }) {
    const r = id ? E.rule(id) : null;
    const teacher = S.role === 'Teacher';
    const [f, setF] = useState(r ? { name: r.name, description: r.description, action: r.action, aiCheck: r.aiCheck, pinned: r.pinned, reportReason: r.reportReason } : { name: '', description: '', action: 'HOLD', aiCheck: true, pinned: false, reportReason: '' });
    const [word, setWord] = useState(''); const [wordMsg, setWordMsg] = useState('');
    const [wordTest, setWordTest] = useState('');
    const [sample, setSample] = useState(''); const [result, setResult] = useState(null);
    const [dlg, setDlg] = useState(null);
    const [newWords, setNewWords] = useState([]);
    const words = r ? S.words.filter(w => w.ruleId === r.id) : [];
    const valid = f.name.trim() && f.description.trim() && f.action;
    const save = () => { const saved = E.saveRule({ ...f, id: r && r.id, words: newWords }); if (!r) onClose(); return saved };
    const wordHits = word.trim() && wordTest.trim() ? E.wordMatches(word, wordTest) : null;
    return html`<div class="overlay" onClick=${e => e.target === e.currentTarget && onClose()}><aside class="sheet" role="dialog" aria-label="Rule">
      <div class="sheet-h"><div><h3>${r ? `Rule ${r.number} · ${r.name}` : 'New rule'} ${r && (r.status === 'PUBLISHED' ? html`<span class="badge ok">Published</span>` : html`<span class="badge">Draft</span>`)}</h3>
        <p>${r ? (r.source === 'LEARNYST' ? 'Provided by Learnyst — you can reword it (row 21)' : 'Written by your academy') : 'A new rule starts as a draft and does nothing until you publish it'}</p></div><button class="btn ghost" onClick=${onClose} aria-label="Close">✕</button></div>
      <div class="sheet-b">
        <div class="field"><label for="r-name">Rule name*</label><input id="r-name" class="inp" disabled=${!teacher} value=${f.name} onInput=${e => setF({ ...f, name: e.target.value })} placeholder="e.g. No asking for exam answers" /></div>
        <div class="field"><label for="r-desc">What it means*</label><textarea id="r-desc" class="inp" disabled=${!teacher} value=${f.description} onInput=${e => setF({ ...f, description: e.target.value })} placeholder="Plain language — the AI judges against exactly this, and learners read it"></textarea></div>
        <div class="field"><label>What happens when it is broken* <${Assume} id="N1">meanings</${Assume}></label>
          <div class="radios">${Object.entries(ACTION).map(([k, a]) => html`<button class="rcard" role="radio" disabled=${!teacher} aria-checked=${f.action === k} onClick=${() => setF({ ...f, action: k })}><b><span class="dot"></span>${a.label}</b><span>${a.meaning}</span></button>`)}</div></div>
        <div class="card"><div class="srow"><div><div class="t">Checked by AI <span class="story">row 30</span></div><div class="d">Off: the rule runs on its blocked words alone, and still works with the AI disabled.</div></div>
            <button class="switch" role="switch" disabled=${!teacher} aria-checked=${f.aiCheck} aria-label="Checked by AI" onClick=${() => setF({ ...f, aiCheck: !f.aiCheck })}></button></div>
          <div class="srow"><div><div class="t">Pin to Copilot <span class="story">row 31</span></div><div class="d">Always reaches a person, even when the academy is on Autopilot.</div></div>
            <button class="switch" role="switch" disabled=${!teacher} aria-checked=${f.pinned} aria-label="Pin to Copilot" onClick=${() => setF({ ...f, pinned: !f.pinned })}></button></div></div>
        <div class="field"><label for="r-reason">Reason shown to learners <span class="story">row 34 · P2</span></label><input id="r-reason" class="inp" disabled=${!teacher} value=${f.reportReason} onInput=${e => setF({ ...f, reportReason: e.target.value })} placeholder="What learners pick when they report under this rule" /></div>

        <div class="card"><div class="card-h"><div><h3>Blocked words and web addresses</h3><p>Stop content on sight, with no AI check. One entry covers disguises: idiot also catches 1d10t, IDIOT, i d i o t, id**t. A web address covers its pages. <span class="story">rows 26–29 · HLD §3</span></p></div></div>
          <div class="card-b">
            <div style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" id="w-new" style="flex:1;min-width:160px" disabled=${!teacher} value=${word} onInput=${e => { setWord(e.target.value); setWordMsg('') }} placeholder="Word or web address*" />
              <button class="btn outline" disabled=${!teacher || !word.trim()} onClick=${() => { if (r) { const res = E.addWord(r.id, word); setWordMsg(res === 'DUPLICATE' ? 'That word is already on this rule.' : ''); if (res === 'OK') setWord('') } else { setNewWords([...newWords, word.trim()]); setWord('') } }}>Add</button></div>
            <div class="field"><label for="w-test">Test this word before saving <span class="story">row 33 · P2</span></label><input id="w-test" class="inp" value=${wordTest} onInput=${e => setWordTest(e.target.value)} placeholder="Type sample text — e.g. Submit your class assignment" />
              ${word.trim() && wordTest.trim() && html`<span class=${'badge ' + (wordHits ? 'bad' : 'ok')}>${wordHits ? `Would stop it — matched “${wordHits}”` : 'Would not stop this text'}</span>`}</div>
            ${wordMsg && html`<span class="badge bad">${wordMsg}</span>`}
            <table class="t" style="min-width:0"><thead><tr><th>Word or web address</th><th>Added by</th><th></th></tr></thead><tbody>
              ${[...words.map(w => ({ ...w })), ...newWords.map((v, i) => ({ id: 'new' + i, value: v, addedBy: 'ACADEMY', pending: true }))].map(w => html`<tr><td class="mono">${w.value}</td><td>${w.addedBy === 'LEARNYST' ? 'Learnyst' : 'Academy'}${w.pending ? ' (saves with the rule)' : ''}</td>
                <td style="text-align:right"><button class="btn sm ghost" disabled=${!teacher} onClick=${() => w.pending ? setNewWords(newWords.filter((_, i) => 'new' + i !== w.id)) : E.deleteWord(w.id)}>Delete</button></td></tr>`)}
              ${!words.length && !newWords.length && html`<tr><td colspan="3" class="story">No blocked words — the AI check alone enforces this rule.</td></tr>`}</tbody></table>
            ${words.some(w => w.addedBy === 'LEARNYST') && html`<span class="story" style="margin:0">Deleting a Learnyst word keeps it deleted for your academy, even when Learnyst updates the defaults (SR 2).</span>`}
          </div></div>

        ${r && html`<div class="card"><div class="card-h"><div><h3>Test this rule</h3><p>Type a sample post and see whether the rule catches it, before any learner is affected. <span class="story">row 32</span> <${Assume} id="C19">AI half simulated</${Assume}></p></div></div>
          <div class="card-b"><textarea class="inp" id="r-sample" value=${sample} onInput=${e => setSample(e.target.value)} placeholder="e.g. Can anyone share tomorrow's mock answers?"></textarea>
            <div><button class="btn outline" disabled=${!sample.trim()} onClick=${() => setResult(E.testRule(r.id, sample))}>Test</button></div>
            ${result && html`<div style="display:grid;gap:6px">
              <span class=${'badge ' + (result.words.length ? 'bad' : 'ok')}>${result.words.length ? `Blocked word: ${result.words.map(w => w.word + ' → “' + w.hit + '”').join(', ')}` : 'No blocked word matched'}</span>
              <span class=${'badge ' + (result.ai && result.ai.breaks ? 'bad' : 'ok')}>${!r.aiCheck ? 'AI checking is off for this rule' : result.ai.breaks ? 'Simulated AI: breaks this rule' : 'Simulated AI: does not break this rule'}</span></div>`}</div></div>`}
      </div>
      <div class="sheet-f">
        ${r && r.source === 'ACADEMY' && html`<button class="btn danger" disabled=${!teacher} style="margin-right:auto" onClick=${() => { E.deleteRule(r.id); onClose() }}>Delete rule</button>`}
        ${r && r.status === 'PUBLISHED' && html`<button class="btn outline" disabled=${!teacher} onClick=${() => E.setRuleStatus(r.id, 'DRAFT')}>Unpublish</button>`}
        ${r && r.status === 'DRAFT' && html`<button class="btn outline" disabled=${!teacher || !valid} onClick=${() => setDlg('publish')}>Publish</button>`}
        <button class="btn primary" disabled=${!teacher || !valid} onClick=${() => (r && r.status === 'PUBLISHED' && (f.name !== r.name || f.description !== r.description)) ? setDlg('reword') : save()}>${r ? 'Save' : 'Create draft'}</button>
      </div>
      ${dlg && html`<div class="dialog-wrap"><div class="dialog" role="dialog"><h3>${dlg === 'publish' ? 'Publish this rule?' : 'Save the new wording?'}</h3>
        <p>This rule applies only to content posted from now on. Posts that are already up will not be checked again. <span class="story">row 24 · SR 4</span></p>
        <div class="f"><button class="btn outline" onClick=${() => setDlg(null)}>Cancel</button><button class="btn primary" onClick=${() => { save(); if (dlg === 'publish') E.setRuleStatus(r.id, 'PUBLISHED'); setDlg(null) }}>${dlg === 'publish' ? 'Publish' : 'Save'}</button></div></div></div>`}
    </aside></div>`;
  }

  // ── settings ──
  function Settings() {
    const teacher = S.role === 'Teacher';
    const [f, setF] = useState(() => JSON.parse(JSON.stringify(S.settings)));
    const [exOpen, setExOpen] = useState(false);
    const dirty = JSON.stringify(f) !== JSON.stringify(S.settings);
    const set = patch => setF({ ...f, ...patch });
    const Sw = ({ on, onClick, label }) => html`<button class="switch" role="switch" aria-checked=${on} aria-label=${label} disabled=${!teacher} onClick=${onClick}></button>`;
    return html`<div class="a-page" style="padding-bottom:80px">
      <div class="a-head"><div><h2>Moderation settings</h2><p>Set once for the academy. One product that needs to differ gets an exception. <span class="story">rows 2–15 · SR 5</span></p></div>
        ${!teacher && html`<span class="badge warn">Read only — Teacher only</span>`}</div>
      <div class="card"><div class="srow"><div><div class="t">AI moderation <span class="story">row 2</span></div><div class="d">Turn content checking on or off for the whole academy.</div></div><${Sw} on=${f.enabled} label="AI moderation" onClick=${() => set({ enabled: !f.enabled })} /></div></div>
      <div class="card"><div class="card-h"><div><h3>Where it runs <span class="story">row 3</span></h3><p>The four places a learner writes. Start with one and widen later. In v1 these are only on/off switches.</p></div></div>
        ${E.PLACES.map(p => html`<div class="srow"><div><div class="t">${p.label}</div><div class="d">${{ product_discussions: 'Discussions under any course, bundle, batch, mock test, test series, ebook, webinar, free resource, podcast or custom product', community: 'Posts and comments', feeds: 'Posts and comments', newsfeed: 'Discussions' }[p.id]}</div></div>
          <${Sw} on=${f.places[p.id]} label=${p.label} onClick=${() => set({ places: { ...f.places, [p.id]: !f.places[p.id] } })} /></div>`)}</div>
      <div class="card"><div class="card-h"><div><h3>Content review mode <span class="story">row 4</span></h3><p>Does content appear before or after the check? Every check takes about a second either way.</p></div></div>
        <div class="card-b"><div class="radios">
          <button class="rcard" role="radio" disabled=${!teacher} aria-checked=${f.reviewMode === 'REVIEW_FIRST'} onClick=${() => set({ reviewMode: 'REVIEW_FIRST' })}><b><span class="dot"></span>Review first <span class="badge">Default</span></b><span>Held until the verdict. Only the author sees it, marked waiting for review. Nothing bad ever appears.</span></button>
          <button class="rcard" role="radio" disabled=${!teacher} aria-checked=${f.reviewMode === 'PUBLISH_FIRST'} onClick=${() => set({ reviewMode: 'PUBLISH_FIRST' })}><b><span class="dot"></span>Publish first</b><span>Live at once. If it breaks a rule it comes down. Conversation never waits.</span></button></div></div></div>
      <div class="card"><div class="card-h"><div><h3>Moderation mode <span class="story">row 5</span></h3><p>Who acts on a flag once it is raised? <${Assume} id="C23">default</${Assume}></p></div></div>
        <div class="card-b"><div class="radios">
          ${[['AUTOPILOT', 'The rule\'s action is applied automatically.'], ['COPILOT', 'Nothing is stopped automatically; flagged content waits for a person.'], ['AI_DISABLED', 'The AI never runs. Blocked words and learner reports only.']].map(([k, d]) => html`<button class="rcard" role="radio" disabled=${!teacher} aria-checked=${f.moderationMode === k} onClick=${() => set({ moderationMode: k })}><b><span class="dot"></span>${MODE[k]}</b><span>${d}</span></button>`)}</div></div></div>
      <div class="card"><div class="card-h"><div><h3>About your academy <span class="story">row 6</span></h3><p>So content is judged in the right context. Sent with every check.</p></div></div>
        <div class="card-b"><div class="field"><label for="s-desc">Description*</label><textarea id="s-desc" class="inp" disabled=${!teacher} value=${f.description} onInput=${e => set({ description: e.target.value })}></textarea></div>
          <div class="row2"><div class="field"><label for="s-age">Learner age group*</label><select id="s-age" class="inp" disabled=${!teacher} value=${f.ageGroup} onChange=${e => set({ ageGroup: e.target.value })}><option value="UNDER_18">Under 18</option><option value="ADULTS">Adults</option><option value="MIXED">Mixed</option></select></div>
            <div class="field"><label for="s-tone">Tone of conversation*</label><select id="s-tone" class="inp" disabled=${!teacher} value=${f.tone} onChange=${e => set({ tone: e.target.value })}><option value="CASUAL">Casual</option><option value="PROFESSIONAL">Professional</option></select><span class="hint">Banter that is normal in one is not in the other.</span></div></div></div></div>
      <div class="card"><div class="card-h"><div><h3>Repeat behaviour</h3><p>Handled without manual checking. <span class="story">rows 7–8</span></p></div></div>
        <div class="card-b"><div class="row3">
          <div class="field"><label for="s-rem">Number of removals*</label><input id="s-rem" type="number" min="1" class="inp" disabled=${!teacher} value=${f.removalsBeforeRestriction} onInput=${e => set({ removalsBeforeRestriction: Math.max(1, +e.target.value || 1) })} /><span class="hint">Confirmed removals that restrict a learner. Flags never count (SR 10).</span></div>
          <div class="field"><label for="s-rep">Number of posts*</label><input id="s-rep" type="number" min="2" class="inp" disabled=${!teacher} value=${f.repeatCount} onInput=${e => set({ repeatCount: Math.max(2, +e.target.value || 2) })} /><span class="hint">Repeated content that counts as spam (P2).</span></div>
          <div class="field"><label for="s-win">Within how long*</label><input id="s-win" type="number" min="1" class="inp" disabled=${!teacher} value=${f.repeatWindow} onInput=${e => set({ repeatWindow: Math.max(1, +e.target.value || 1) })} /><span class="hint">Minutes. <${Assume} id="C23">unit</${Assume}></span></div></div></div></div>
      <div class="card"><div class="srow"><div><div class="t">Hold a new learner's first posts <span class="story">row 9 · P3</span></div><div class="d">For academies with free signup. Off by default.</div></div><${Sw} on=${f.holdFirstEnabled} label="Hold first posts" onClick=${() => set({ holdFirstEnabled: !f.holdFirstEnabled })} /></div>
        ${f.holdFirstEnabled && html`<div class="srow"><div class="field"><label for="s-first">Number of first posts to hold*</label><input id="s-first" type="number" min="1" class="inp" style="max-width:140px" disabled=${!teacher} value=${f.holdFirstCount} onInput=${e => set({ holdFirstCount: Math.max(1, +e.target.value || 1) })} /></div><span></span></div>`}</div>
      <div class="card"><div class="card-h"><div><h3>Exceptions <span class="story">rows 10–15 · P2</span></h3><p>One product set differently from the academy. Rules are only ever written in Rules — an exception can switch one off, never create one.</p></div>
        <button class="btn outline" disabled=${!teacher} onClick=${() => setExOpen(true)}>+ Add exception</button></div>
        <div class="tablewrap"><table class="t" style="min-width:560px"><thead><tr><th>Product</th><th>What is different</th><th>Set on</th><th></th></tr></thead><tbody>
          ${S.exceptions.length ? S.exceptions.map(ex => { const pr = E.PRODUCTS.find(x => x.id === ex.productId); const diff = [ex.reviewMode && REVIEW[ex.reviewMode], ex.moderationMode && MODE[ex.moderationMode], ...ex.disabledRuleIds.map(id => 'Rule ' + E.rule(id).number + ' off')].filter(Boolean); return html`<tr><td>${pr.type} · ${pr.name}</td><td>${diff.join(' · ') || 'Nothing yet'}</td><td class="mono">t=${ex.setOn}</td><td style="text-align:right"><button class="btn sm ghost" disabled=${!teacher} onClick=${() => E.deleteException(ex.id)}>Remove</button></td></tr>` })
            : html`<tr><td colspan="4" class="story">No exceptions. Most academies will have none.</td></tr>`}</tbody></table></div></div>
      ${dirty && html`<div style="position:sticky;bottom:0;background:#fff;border:1px solid var(--a-border);border-radius:10px;padding:10px 14px;display:flex;gap:8px;justify-content:space-between;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.06)">
        <span class="story" style="margin:0">Unsaved changes. New settings apply to new content; nothing already up is re-checked.</span>
        <span style="display:flex;gap:8px"><button class="btn outline" onClick=${() => setF(JSON.parse(JSON.stringify(S.settings)))}>Discard</button><button class="btn primary" disabled=${!teacher || !f.description.trim()} onClick=${() => E.saveSettings(f)}>Save changes</button></span></div>`}
      ${exOpen && html`<${ExceptionDialog} onClose=${() => setExOpen(false)} />`}
    </div>`;
  }

  function ExceptionDialog({ onClose }) {
    const [p, setP] = useState(E.PRODUCTS[0].id); const [rm, setRm] = useState(''); const [mm, setMm] = useState(''); const [off, setOff] = useState([]);
    return html`<div class="dialog-wrap"><div class="dialog" role="dialog" aria-label="Add exception" style="width:min(520px,100%)"><h3>Add an exception</h3>
      <div class="field"><label for="x-p">Product*</label><select id="x-p" class="inp" value=${p} onChange=${e => setP(e.target.value)}>${E.PRODUCTS.map(x => html`<option value=${x.id}>${x.type} · ${x.name}</option>`)}</select></div>
      <div class="row2"><div class="field"><label for="x-rm">Content review mode</label><select id="x-rm" class="inp" value=${rm} onChange=${e => setRm(e.target.value)}><option value="">Follow the academy</option><option value="REVIEW_FIRST">Review first</option><option value="PUBLISH_FIRST">Publish first</option></select></div>
        <div class="field"><label for="x-mm">Moderation mode</label><select id="x-mm" class="inp" value=${mm} onChange=${e => setMm(e.target.value)}><option value="">Follow the academy</option><option value="AUTOPILOT">Autopilot</option><option value="COPILOT">Copilot</option><option value="AI_DISABLED">AI disabled</option></select></div></div>
      <div class="field"><label>Switch rules off for this product <span class="story">row 11</span></label><div style="display:grid;gap:4px;max-height:160px;overflow:auto">
        ${S.rules.filter(r => r.status === 'PUBLISHED').map(r => html`<label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" checked=${off.includes(r.id)} onChange=${() => setOff(off.includes(r.id) ? off.filter(x => x !== r.id) : [...off, r.id])} />Rule ${r.number} · ${r.name}</label>`)}</div></div>
      <div class="f"><button class="btn outline" onClick=${onClose}>Cancel</button><button class="btn primary" onClick=${() => { E.saveException({ productId: p, reviewMode: rm || null, moderationMode: mm || null, disabledRuleIds: off }); onClose() }}>Add exception</button></div></div></div>`;
  }

  // ── restrictions & bans ──
  function Limits() {
    const teacher = S.role === 'Teacher';
    const rows = [];
    Object.entries(S.members).forEach(([id, m]) => {
      if (m.restricted) rows.push({ id, kind: 'Restricted', where: 'Whole academy', since: m.restricted.since, why: m.restricted.source === 'AUTOMATIC' ? `${m.removals} confirmed removals` : 'By a person', lift: () => E.liftRestriction(id) });
      m.bans.forEach(b => rows.push({ id, kind: 'Banned', where: b.scope === 'ACADEMY' ? 'Whole academy' : E.PRODUCTS.find(x => x.id === b.productId).name, since: b.since, why: 'By a Teacher', lift: () => E.liftBan(id, b.id) }));
    });
    return html`<div class="a-page"><div class="a-head"><div><h2>Restrictions & bans</h2><p>Who is limited, where, and why. Restrict and ban from the queue, beside the content; this page is the list and the undo. <span class="story">rows 57–59 · SR 20</span></p></div></div>
      <div class="card"><div class="tablewrap"><table class="t"><thead><tr><th>Learner</th><th>Restricted or banned</th><th>Where it applies</th><th>Why</th><th>Since</th><th></th></tr></thead><tbody>
        ${rows.length ? rows.map(r => html`<tr><td><span style="display:flex;gap:6px;align-items:center"><${Avatar} id=${r.id} size=${22} />${E.person(r.id).name}</span></td><td>${r.kind === 'Restricted' ? html`<span class="badge warn">Restricted</span>` : html`<span class="badge bad">Banned</span>`}</td><td>${r.where}</td><td>${r.why}</td><td class="mono">${rel(r.since)}</td>
          <td style="text-align:right"><button class="btn sm outline" disabled=${!teacher} title=${teacher ? '' : 'Teacher only'} onClick=${r.lift}>${r.kind === 'Restricted' ? 'Lift restriction' : 'Lift ban'}</button></td></tr>`)
          : html`<tr><td colspan="6"><div class="empty"><b>No one is restricted or banned</b><span>Restrict or ban from a queue item's "Who wrote it" panel.</span></div></td></tr>`}</tbody></table></div></div></div>`;
  }

  // ── reports ──
  function Reports() {
    const st = E.stats();
    const where = E.PLACES.filter(p => S.settings.places[p.id]).map(p => p.label).join(', ');
    return html`<div class="a-page"><div class="a-head"><div><h2>Moderation reports</h2><p>Is moderation keeping up? Numbers for this demo session. <span class="story">rows 61–67</span></p></div></div>
      <div class="kpis">
        ${[[st.checked, 'Content checked'], [st.blocked, 'Blocked before publishing'], [st.held, 'Held or flagged for review'], [st.approvedAfterReview, 'Approved after review'], [st.removed, 'Removed'], [st.reported, 'Reported by learners'], [st.waiting, 'Waiting for review'], [st.oldest == null ? '—' : st.oldest + ' min', 'Longest waiting'], [st.unchecked, 'Published without a check']].map(([v, k]) => html`<div class="kpi"><span class="v">${v}</span><span class="k">${k}</span></div>`)}</div>
      <p class="story" style="margin:0">Where it runs: ${where || 'nowhere'}</p>
      <div class="card"><div class="card-h"><div><h3>Rule performance <span class="story">row 62</span></h3><p>Approved high → too strict. Wrong-flag rate = content a rule stopped that a Teacher then approved.</p></div></div>
        <div class="tablewrap"><table class="t"><thead><tr><th>Rule</th><th>Times it stopped content</th><th>Approved anyway</th><th>Removed</th><th>Wrong-flag rate</th></tr></thead><tbody>
          ${st.perRule.map(x => html`<tr><td>Rule ${x.rule.number} · ${x.rule.name}</td><td class="mono">${x.stopped}</td><td class="mono">${x.approvedAnyway}</td><td class="mono">${x.removed}</td>
            <td>${x.wrongFlag == null ? html`<span class="story">—</span>` : html`<span style="display:flex;gap:8px;align-items:center"><span class="bar" style="width:90px"><i style=${`width:${x.wrongFlag}%;background:${x.wrongFlag > 30 ? 'var(--a-danger)' : 'var(--a-selected)'}`}></i></span><span class="mono">${x.wrongFlag}%</span></span>`}</td></tr>`)}</tbody></table></div></div>
      <div class="card"><div class="card-h"><div><h3>Moderation log <span class="story">row 67</span></h3><p>Every action, including content that was blocked and never published — the evidence when a decision is disputed.</p></div></div>
        <div class="tablewrap"><table class="t"><thead><tr><th>Action</th><th>Content</th><th>Rule</th><th>When</th></tr></thead><tbody>
          ${[...S.records.map(b => ({ a: b.byAi ? 'Blocked by the AI' : 'Blocked word', content: b.text, rule: E.rule(b.ruleId), at: b.at })),
             ...S.queue.filter(q => q.decidedAt != null).map(q => ({ a: (q.restored ? 'Restored' : q.status === 'APPROVED' ? 'Approved' : 'Removed') + ' by ' + (q.decidedBy || 'a person'), content: excerpt(contentOf(q.contentId)), rule: E.rule(q.ruleId), at: q.decidedAt }))]
            .sort((a, b) => b.at - a.at).map(x => html`<tr><td>${x.a}</td><td><div class="cell-content"><span>${x.content}</span></div></td><td>${x.rule ? 'Rule ' + x.rule.number : '—'}</td><td class="mono">${rel(x.at)}</td></tr>`)}
          ${!S.records.length && !S.queue.some(q => q.decidedAt != null) && html`<tr><td colspan="4" class="story">Nothing yet.</td></tr>`}</tbody></table></div></div></div>`;
  }

  // ── behind the scenes ──
  function Log() {
    const lanes = { learner: ['Learner app', 'var(--lane-learner)'], rails: ['Rails', 'var(--lane-rails)'], ai: ['ai-server', 'var(--lane-ai)'], admin: ['Admin app', 'var(--lane-admin)'], sys: ['Demo', 'var(--lane-sys)'] };
    return html`<section class="logbar" aria-label="Behind the scenes"><div class="h"><b>Behind the scenes — what each system does, newest first</b>
      <span class="lanes">${Object.values(lanes).map(([l, c]) => html`<span style=${`--c:${c}`}>${l}</span>`)}</span></div>
      <div class="logs">${S.log.slice(0, 120).map(e => { const [l, c] = lanes[e.lane] || lanes.sys; return html`<div class="lg" style=${`--c:${c}`}><span class="tm">t=${e.t}</span><span class="ln">${l}</span><span class="tx">${e.text}${e.assumption && html`<span class="assume" title=${e.assumption.split(' · ').map(a => ASSUME[a] || a).join(' ')}>Assumption · ${e.assumption}</span>`}</span></div>` })}</div></section>`;
  }

  render(html`<${App} />`, document.getElementById('app'));
  if (fresh) ls.set('mod-proto-seeded-v1', true);
})();

</script>
