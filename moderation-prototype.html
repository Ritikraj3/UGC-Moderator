<title>Moderation Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a dark demo bar on top; below it the admin app and the learner app side by side (stacked on narrow screens),
   each drawn in its product's own look; a "behind the scenes" log slides up from the bottom.
   Deliberately single-theme (light): the two product UIs are reproduced as they ship in light mode. */
:root {
  color-scheme: light;
  /* admin app — learnyst-admin src/index.css */
  --a-bg: #ffffff; --a-fg: #282828; --a-muted: #6e6e6e; --a-primary: #001205; --a-primary-hover: #042c0f;
  --a-secondary: #f5f5f5; --a-secondary-hover: #e5e5e5; --a-border: #e3e1e6; --a-input: #f8f8f8; --a-ring: #4fba58;
  --a-selected: #399f4b; --a-sidebar-fg: #404040; --a-sidebar-muted: #737373; --a-sidebar-accent: #f5f5f5;
  --a-danger: #dc2626; --a-danger-soft: #fef2f2; --a-page: #fafafa;
  --a-ok: #3d7a10; --a-ok-soft: #eef9e0; --a-warn: #8a6200; --a-warn-soft: #fef6d6; --a-info: #2f4fd6; --a-info-soft: #eef1fe;
  --a-radius: 10px; --a-radius-sm: 8px;
  /* learner app — bodhi Socials tokens (--lyst-*, --primary-*) */
  --l-bg-1: #f4f5f7; --l-bg-2: #ffffff; --l-fg: #1b1f24; --l-hint: #6b7280; --l-border: #e4e6ea; --l-primary: #4f46e5;
  --l-primary-soft: #eef0ff; --l-danger: #c62828; --l-danger-soft: #fdecec; --l-warn: #8a5a00; --l-warn-soft: #fff4dc;
  --l-ok: #1e7b45; --l-ok-soft: #e4f5eb; --l-info: #1f5fbf; --l-info-soft: #e8f0fd; --l-radius: 12px;
  /* demo chrome */
  --d-bg: #16181d; --d-fg: #eceef2; --d-muted: #9aa1ad; --d-line: #2b2f37; --d-accent: #f5c542;
  --lane-learner: #7c4dff; --lane-rails: #0f8a8a; --lane-ai: #c56a00; --lane-admin: #2f6fe0; --lane-sys: #6b7280;
  --img-a: #e8f1e4; --img-b: #fdeee2; --img-c: #e7ecfb;
  --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { background: #e9ebef; color: var(--a-fg); font: 14px/1.5 var(--font); padding-inline: 0; padding-block: 0 }
button { font: inherit; color: inherit; cursor: pointer }
input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--a-ring); outline-offset: 2px }
.mono { font-family: var(--mono); font-size: 12px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }

/* ── demo bar ── */
.demobar { background: var(--d-bg); color: var(--d-fg); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; position: sticky; top: 0; z-index: 55 }
.demobar h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .01em; display: flex; gap: 8px; align-items: center }
.demobar h1 small { font-weight: 500; color: var(--d-muted); font-size: 12px }
.dgroup { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.dgroup > .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--d-muted) }
.dseg { display: inline-flex; background: #232730; border-radius: 8px; padding: 2px }
.dseg button { border: 0; background: none; color: var(--d-muted); padding: 5px 10px; border-radius: 6px; font-size: 13px }
.dseg button[aria-pressed="true"] { background: var(--d-fg); color: var(--d-bg); font-weight: 600 }
.dbtn { border: 1px solid var(--d-line); background: #20242c; color: var(--d-fg); padding: 5px 10px; border-radius: 8px; font-size: 13px }
.dbtn:hover { border-color: var(--d-muted) }
.dbtn.hot { border-color: var(--d-accent); color: var(--d-accent) }
.clock { font-family: var(--mono); font-size: 12px; color: var(--d-accent) }
.spacer { flex: 1 }
.scen { position: relative }
.scen-menu { position: absolute; top: calc(100% + 6px); left: 0; width: min(420px, 92vw); background: #1d2027; border: 1px solid var(--d-line); border-radius: 10px; padding: 6px; z-index: 50; display: grid; gap: 2px; box-shadow: 0 12px 30px rgba(0,0,0,.35); max-height: calc(100vh - 90px); overflow-y: auto }
.scen-menu button { text-align: left; background: none; border: 0; color: var(--d-fg); padding: 8px 10px; border-radius: 8px; display: grid; gap: 2px }
.scen-menu button:hover { background: #2a2e37 }
.scen-menu small { color: var(--d-muted); font-size: 12px; line-height: 1.35 }

/* ── stage ── */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 12px; align-items: start }
.stage.one { grid-template-columns: minmax(0, 1fr) }
@media (max-width: 1180px) { .stage { grid-template-columns: minmax(0, 1fr) } }
.stage.withlog .frame { height: calc(70vh - 104px); min-height: 420px }
.frame { border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 24px rgba(15,20,30,.08); min-width: 0; display: flex; flex-direction: column; height: calc(100vh - 92px); min-height: 640px }
.frame-label { background: #d9dce2; color: #404652; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; padding: 6px 12px; display: flex; justify-content: space-between; gap: 8px }
.frame-body { flex: 1; min-height: 0; display: flex }

/* ── admin app ── */
.admin { background: var(--a-page); color: var(--a-fg); font-family: var(--font); flex: 1; display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0 }
@media (max-width: 760px) { .admin { grid-template-columns: minmax(0, 1fr) } .a-side { display: none } }
.a-side { background: var(--a-bg); border-right: 1px solid var(--a-border); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto }
.a-brand { display: flex; gap: 8px; align-items: center; padding: 4px 8px 14px; font-weight: 700 }
.a-brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--a-primary); color: #fff; display: grid; place-items: center; font-size: 13px }
.a-brand small { display: block; font-weight: 500; color: var(--a-muted); font-size: 11px }
.a-grp { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--a-sidebar-muted); padding: 12px 10px 4px }
.a-nav { border: 0; background: none; text-align: left; padding: 7px 10px; border-radius: 8px; color: var(--a-sidebar-fg); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; width: 100% }
.a-nav:hover { background: var(--a-sidebar-accent) }
.a-nav.dim { color: #a3a3a3; cursor: default }
.a-nav.dim:hover { background: none }
.a-nav.on { background: #eef8ef; color: var(--a-selected); font-weight: 600 }
.a-nav.sub { padding-left: 24px }
.a-count { background: var(--a-danger); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px; line-height: 18px; font-weight: 600 }
.a-main { overflow-y: auto; min-width: 0; display: flex; flex-direction: column }
.a-top { background: var(--a-bg); border-bottom: 1px solid var(--a-border); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.crumbs { color: var(--a-muted); font-size: 13px }
.crumbs b { color: var(--a-fg); font-weight: 600 }
.who { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--a-muted) }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none }
.a-page { padding: 20px; display: grid; gap: 16px; align-content: start }
.a-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap }
.a-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em }
.a-head p { margin: 4px 0 0; color: var(--a-muted); max-width: 64ch }
.card { background: var(--a-bg); border: 1px solid var(--a-border); border-radius: var(--a-radius); min-width: 0 }
.card-h { padding: 14px 16px; border-bottom: 1px solid var(--a-border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 600 }
.card-h p { margin: 2px 0 0; color: var(--a-muted); font-size: 13px }
.card-b { padding: 16px; display: grid; gap: 14px }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--a-border) }
.srow:first-child { border-top: 0 }
.srow .t { font-weight: 600; font-size: 14px }
.srow .d { color: var(--a-muted); font-size: 13px }
.story { font-family: var(--mono); font-size: 11px; color: #9a9a9a; margin-left: 6px; font-weight: 400 }
.btn { border: 1px solid transparent; border-radius: var(--a-radius-sm); padding: 7px 14px; font-weight: 600; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; background: var(--a-secondary); color: var(--a-fg) }
.btn:hover { background: var(--a-secondary-hover) }
.btn.primary { background: var(--a-primary); color: #fff }
.btn.primary:hover { background: var(--a-primary-hover) }
.btn.outline { background: var(--a-bg); border-color: var(--a-border) }
.btn.outline:hover { background: var(--a-input) }
.btn.danger { background: var(--a-danger-soft); color: var(--a-danger); border-color: #f7c9c9 }
.btn.ghost { background: none }
.btn.sm { padding: 4px 10px; font-size: 12.5px }
.btn[disabled] { opacity: .45; cursor: not-allowed }
.switch { width: 36px; height: 20px; border-radius: 99px; border: 0; background: #d4d4d4; position: relative; flex: none; padding: 0 }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s }
.switch[aria-checked="true"] { background: var(--a-selected) }
.switch[aria-checked="true"]::after { transform: translateX(16px) }
.switch[disabled] { opacity: .5; cursor: not-allowed }
.field { display: grid; gap: 6px }
.field > label { font-weight: 600; font-size: 13px }
.field .hint { color: var(--a-muted); font-size: 12.5px }
.inp { width: 100%; background: var(--a-input); border: 1px solid var(--a-border); border-radius: var(--a-radius-sm); padding: 8px 10px; font-size: 14px }
.inp:focus { outline: none; border-color: var(--a-ring); box-shadow: 0 0 0 3px #f2fbf2 }
textarea.inp { resize: vertical; min-height: 72px }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
@media (max-width: 640px) { .row2, .row3 { grid-template-columns: minmax(0, 1fr) } }
.radios { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) }
.rcard { border: 1px solid var(--a-border); border-radius: var(--a-radius); background: var(--a-bg); padding: 12px; text-align: left; display: grid; gap: 4px; align-content: start }
.rcard b { font-size: 14px; display: flex; gap: 8px; align-items: center }
.rcard span { color: var(--a-muted); font-size: 12.5px; line-height: 1.4 }
.rcard[aria-checked="true"] { border-color: var(--a-selected); box-shadow: inset 0 0 0 1px var(--a-selected); background: #f7fcf7 }
.rcard[disabled] { opacity: .55; cursor: not-allowed }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #c4c4c4; flex: none }
.rcard[aria-checked="true"] .dot { border-color: var(--a-selected); background: radial-gradient(var(--a-selected) 45%, transparent 50%) }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--a-secondary); color: var(--a-fg) }
.badge.ok { background: var(--a-ok-soft); color: var(--a-ok) }
.badge.warn { background: var(--a-warn-soft); color: var(--a-warn) }
.badge.bad { background: var(--a-danger-soft); color: var(--a-danger) }
.badge.info { background: var(--a-info-soft); color: var(--a-info) }
.badge.dark { background: var(--a-primary); color: #fff }
.assume { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 600; color: #7a4d00; background: #fff3d6; border: 1px dashed #e0b050; border-radius: 6px; padding: 1px 6px; white-space: nowrap; cursor: help }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--a-border); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 9px 12px; font-weight: 600; color: var(--a-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; gap: 6px; align-items: center }
.tabs button[aria-selected="true"] { color: var(--a-fg); border-bottom-color: var(--a-primary) }
.tabs .n { background: var(--a-secondary); border-radius: 99px; padding: 0 7px; font-size: 11.5px }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.filters select { background: var(--a-bg); border: 1px solid var(--a-border); border-radius: 8px; padding: 6px 8px; font-size: 13px }
.tablewrap { overflow-x: auto }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 720px }
table.t th { text-align: left; font-weight: 600; color: var(--a-muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--a-border); background: #fcfcfc; white-space: nowrap }
table.t td { padding: 11px 12px; border-bottom: 1px solid var(--a-border); vertical-align: top }
table.t tr.click:hover td { background: #fafafa; cursor: pointer }
table.t tr:last-child td { border-bottom: 0 }
.cell-content { display: grid; gap: 2px; max-width: 280px }
.cell-content b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.cell-content span { color: var(--a-muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.rowacts { display: flex; gap: 6px }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px }
.kpi { background: var(--a-bg); border: 1px solid var(--a-border); border-radius: var(--a-radius); padding: 12px 14px; display: grid; gap: 2px }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums }
.kpi .k { color: var(--a-muted); font-size: 12.5px }
.kpi.alert { border-color: #f3b5b5; background: #fffafa }
.empty { padding: 36px 16px; text-align: center; color: var(--a-muted); display: grid; gap: 6px; justify-items: center }
.empty b { color: var(--a-fg) }
.bar { height: 8px; background: var(--a-secondary); border-radius: 99px; overflow: hidden; min-width: 80px }
.bar i { display: block; height: 100% }

/* sheet + dialog */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 60; display: flex; justify-content: flex-end }
.sheet { background: var(--a-bg); width: min(760px, 100%); height: 100%; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.15) }
.sheet-h { padding: 16px 20px; border-bottom: 1px solid var(--a-border); display: flex; justify-content: space-between; gap: 12px; align-items: flex-start }
.sheet-h h3 { margin: 0; font-size: 17px }
.sheet-h p { margin: 3px 0 0; color: var(--a-muted); font-size: 13px }
.sheet-b { flex: 1; overflow-y: auto; padding: 18px 20px; display: grid; gap: 16px; align-content: start }
.sheet-f { border-top: 1px solid var(--a-border); padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; background: #fcfcfc }
.panes { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px }
@media (max-width: 700px) { .panes { grid-template-columns: minmax(0, 1fr) } }
.pane { border: 1px solid var(--a-border); border-radius: var(--a-radius); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.pane h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--a-muted) }
.quote { background: var(--a-input); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere }
.ai-reason { background: var(--a-info-soft); color: #1f3aa8; border-radius: 8px; padding: 10px 12px; font-size: 13px }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 10px; font-size: 13px }
.kv dt { color: var(--a-muted) }
.kv dd { margin: 0 }
.hist { display: grid; gap: 6px; font-size: 13px }
.hist div { display: flex; gap: 8px; justify-content: space-between }
.dialog-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 70; display: grid; place-items: center; padding: 16px }
.dialog { background: var(--a-bg); border-radius: 12px; width: min(460px, 100%); padding: 20px; display: grid; gap: 12px; box-shadow: 0 20px 40px rgba(0,0,0,.2) }
.dialog h3 { margin: 0; font-size: 17px }
.dialog p { margin: 0; color: var(--a-muted) }
.dialog .f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #171717; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 90; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 90vw }

/* ── learner app (Socials) ── */
.learner { background: var(--l-bg-1); color: var(--l-fg); flex: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; font-family: var(--font) }
.l-nav { background: var(--l-bg-2); border-bottom: 1px solid var(--l-border); height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px }
.l-nav .brand { display: flex; gap: 8px; align-items: center; font-weight: 700; min-width: 0 }
.l-nav .logo { width: 28px; height: 28px; border-radius: 8px; background: var(--l-primary); color: #fff; display: grid; place-items: center; font-size: 13px; flex: none }
.l-pills { display: flex; gap: 4px; margin: 0 auto; overflow-x: auto }
.l-pills span { padding: 6px 12px; border-radius: 99px; font-size: 13px; color: var(--l-hint); white-space: nowrap }
.l-pills span.on { border: 1px solid var(--l-border); color: var(--l-fg); font-weight: 600 }
.l-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0 }
@media (max-width: 760px) { .l-body { grid-template-columns: minmax(0, 1fr) } .l-side { display: none } }
.l-side { background: var(--l-bg-2); border-right: 1px solid var(--l-border); padding: 12px 10px; overflow-y: auto; display: grid; gap: 2px; align-content: start }
.l-side .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--l-hint); padding: 10px 10px 4px }
.l-space { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 8px; display: flex; gap: 8px; align-items: center; font-size: 13.5px; width: 100% }
.l-space i { width: 10px; height: 10px; border-radius: 50%; flex: none }
.l-space:hover { background: var(--l-bg-1) }
.l-space.on { background: var(--l-fg); color: var(--l-bg-2); font-weight: 600 }
.l-space.off { color: var(--l-hint) }
.l-main { overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0 }
.l-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap }
.l-head h2 { margin: 0; font-size: 20px; display: flex; gap: 8px; align-items: center }
.l-head h2 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block }
.lcard { background: var(--l-bg-2); border: 1px solid var(--l-border); border-radius: var(--l-radius); padding: 14px 16px; display: grid; gap: 10px; min-width: 0 }
.l-btn { border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 13.5px; background: var(--l-primary); color: #fff }
.l-btn.ghost { background: var(--l-bg-1); color: var(--l-fg) }
.l-btn[disabled] { opacity: .5; cursor: not-allowed }
.l-inp { width: 100%; border: 1px solid var(--l-border); background: var(--l-bg-2); border-radius: 8px; padding: 9px 11px; font-size: 14px }
.l-inp:focus { outline: none; border-color: var(--l-primary); box-shadow: 0 0 0 3px var(--l-primary-soft) }
textarea.l-inp { min-height: 70px; resize: vertical }
.start { display: flex; gap: 10px; align-items: center; border: 1px solid var(--l-border); background: var(--l-bg-2); border-radius: var(--l-radius); padding: 10px 14px; width: 100%; text-align: left; color: var(--l-hint) }
.imgs { display: flex; gap: 8px; flex-wrap: wrap }
.imgpick { border: 1px solid var(--l-border); background: var(--l-bg-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: flex; gap: 6px; align-items: center }
.imgpick[aria-pressed="true"] { border-color: var(--l-primary); background: var(--l-primary-soft); color: var(--l-primary); font-weight: 600 }
.demo-box { border: 1px dashed #c9a23b; background: #fffaf0; border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: #6b4e00 }
